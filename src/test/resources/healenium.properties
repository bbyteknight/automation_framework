# healenium-web's own config (read from the classpath — see CONTRIBUTING.md "Self-healing
# locators (Healenium)"). This only takes effect for scenarios where utils.DriverFactory
# actually wrapped the driver in SelfHealingDriver, which itself requires
# selfHealingEnabled=true in config/<env>.properties (default: false, see dev.properties).
#
# heal-enabled here is healenium-web's own flag (separate from this project's
# selfHealingEnabled toggle): it decides whether a wrapped driver that WAS created still
# heals, vs. just recording what it sees. Can also be overridden per-run without editing this
# file via -Dheal-enabled=false (documented by healenium-web itself).
heal-enabled = true

# Number of previously-seen healthy locator snapshots considered when proposing a replacement
# for a broken one.
recovery-tries = 2

# Minimum similarity score (0-1) a candidate replacement locator must meet to be applied
# automatically. Healing attempts below this are recorded but NOT applied.
score-cap = 0.6

# hlm-backend's address — see docker-compose-healenium.yml (same ports as its README default).
hlm.server.url = http://localhost:7878
# Image-based locator healing isn't used by this project (checklist only covers locator
# healing/reporting), but healenium-web expects this key to be present either way.
hlm.imitator.url = http://localhost:8000
