name: CI - Automation Suite

on:
  workflow_dispatch:
    inputs:
      env:
        description: Target environment (loads config/<env>.properties)
        required: false
        default: dev
        type: choice
        options: [dev, qa, staging]
      platform:
        description: Test platform scope (android/ios need an Appium server, not yet available in this CI runner; desktop needs the self-hosted Windows runner, see the desktop job)
        required: false
        default: all
        type: choice
        options: [web, api, android, ios, desktop, all]
      tags:
        description: Additional Cucumber tag filter, ANDed with the platform scope (optional)
        required: false
        default: ""
      browser:
        description: Browser to run against (web platform only for now)
        required: false
        default: chrome
        type: choice
        options: [chrome, firefox, edge]
      min_pass_rate:
        description: Quality gate minimum pass rate percentage
        required: false
        default: "95"
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  # Nightly full cross-browser run — disabled for now, uncomment to re-enable.
  # Mobile (@android/@ios) stays excluded regardless — there's no Appium
  # server/device on this runner yet, see the platform input.
  # schedule:
  #   - cron: "0 2 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Desktop-only manual runs skip this ubuntu job entirely — @desktop scenarios need the
    # self-hosted Windows runner (see the desktop job below), not this Linux matrix.
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'desktop'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cross-browser only on the nightly schedule; every other trigger
        # stays single-browser (chrome) to keep PR/push feedback fast.
        browser: ${{ github.event_name == 'schedule' && fromJson('["chrome","firefox","edge"]') || fromJson('["chrome"]') }}
    env:
      ENV: ${{ inputs.env || 'dev' }}
      BROWSER: ${{ inputs.browser || matrix.browser }}
      HEADLESS: "true"
      EXECUTION_MODE: local
      # Only LOGIN_USERNAME/LOGIN_PASSWORD are populated as repo secrets today.
      # The rest resolve to empty string until added — ConfigReader just warns,
      # it doesn't fail the build, for scenarios that don't need them.
      LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
      API_CLIENT_SECRET: ${{ secrets.API_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B -ntp clean compile test-compile

      - name: Start infrastructure (verify headless Chrome)
        run: google-chrome --version
        # ubuntu-latest ships Chrome; WebDriverManager (already a project
        # dependency) downloads a matching chromedriver at test runtime.

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Test (with automatic rerun of failed scenarios)
        id: run_tests
        continue-on-error: true
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
          EXTRA_TAGS: ${{ inputs.tags }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          chmod +x scripts/rerun-failed-tests.sh
          case "$PLATFORM" in
            web) PLATFORM_TAGS="@web" ;;
            api) PLATFORM_TAGS="@api" ;;
            android) PLATFORM_TAGS="@android" ;;
            ios) PLATFORM_TAGS="@ios" ;;
            # desktop never reaches this ubuntu job (see the job-level `if` above) — kept here
            # only so an unexpected PLATFORM value doesn't fall through to the "all" case below.
            desktop) PLATFORM_TAGS="@desktop" ;;
            *) PLATFORM_TAGS="not @android and not @ios and not @desktop" ;;
          esac

          if [ -n "$EXTRA_TAGS" ]; then
            FILTER="($PLATFORM_TAGS) and ($EXTRA_TAGS)"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            # PRs only need the fast smoke + API coverage, not the full suite.
            FILTER="($PLATFORM_TAGS) and (@smoke or @api)"
          else
            FILTER="$PLATFORM_TAGS"
          fi

          echo "Resolved tag filter: $FILTER"
          ./scripts/rerun-failed-tests.sh -Dcucumber.filter.tags="$FILTER"

      - name: Download previous Allure history (for trend graphs)
        # The currently-published GitHub Pages report is the only place this
        # history persists between runs (no separate artifact store for it).
        # Best-effort: the very first run (or the firefox/edge nightly legs,
        # which don't publish to Pages) has nothing to fetch yet — that's fine,
        # Allure just starts a fresh trend from this run.
        if: always() && matrix.browser == 'chrome'
        run: |
          mkdir -p target/allure-results/history
          for f in history.json history-trend.json categories-trend.json duration-trend.json retry-trend.json; do
            curl -fsSL "https://bbyteknight.github.io/automation_framework/history/$f" \
              -o "target/allure-results/history/$f" || true
          done

      - name: Generate Allure report
        if: always()
        run: mvn -B -ntp exec:exec@allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.browser }}
          path: target/allure-report
          retention-days: 30

      - name: Upload Allure report for GitHub Pages
        # Pages only accepts one artifact per run; the chrome leg (always
        # present) is the canonical one, so skip this on the other
        # nightly cross-browser matrix legs to avoid an artifact-name clash.
        if: always() && matrix.browser == 'chrome'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/allure-report

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.browser }}
          path: target/cucumber-reports
          retention-days: 30

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.browser }}
          path: test-output/screenshots
          retention-days: 30
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: echo "Ephemeral runner — no persistent infrastructure to tear down."

      - name: Quality gate (pass-rate threshold + critical-tag failures)
        id: quality_gate
        if: always()
        env:
          MIN_PASS_RATE: ${{ inputs.min_pass_rate || '95' }}
        run: |
          JSON=target/cucumber-reports/run2.json
          if [ ! -f "$JSON" ]; then
            echo "No report JSON found — treating as a failure."
            echo "summary=No report generated." >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # @flaky-tagged scenarios are quarantined: they still run (so Allure
          # keeps tracking their trend), but don't count toward the pass-rate
          # gate. @critical is checked across ALL scenarios regardless of
          # @flaky — a scenario should never be both; if one is, this gate is
          # the forcing function to resolve that contradiction rather than
          # silently letting it slide.
          TOTAL=$(jq '[.[] | .elements[]? | select(.type == "scenario") | select([.tags[]?.name] | index("@flaky") | not)] | length' "$JSON")
          FAILED=$(jq '[.[] | .elements[]? | select(.type == "scenario") | select([.tags[]?.name] | index("@flaky") | not) | select([.steps[]?.result.status] | index("failed"))] | length' "$JSON")
          FLAKY_FAILED=$(jq '[.[] | .elements[]? | select(.type == "scenario") | select([.tags[]?.name] | index("@flaky")) | select([.steps[]?.result.status] | index("failed"))] | length' "$JSON")
          CRITICAL_FAILED=$(jq '[.[] | .elements[]? | select(.type == "scenario") | select(.tags[]?.name == "@critical") | select([.steps[]?.result.status] | index("failed"))] | length' "$JSON")
          PASSED=$((TOTAL - FAILED))
          PASS_RATE=$(( TOTAL > 0 ? PASSED * 100 / TOTAL : 0 ))

          SUMMARY="${PASSED}/${TOTAL} scenarios passed (${PASS_RATE}%), ${CRITICAL_FAILED} @critical failure(s), ${FLAKY_FAILED} quarantined @flaky failure(s)"
          echo "$SUMMARY"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

          if [ "$FLAKY_FAILED" -gt 0 ]; then
            echo "NOTE: $FLAKY_FAILED quarantined @flaky scenario(s) failed — not blocking, but flag for the flaky-test review (see FLAKY_TESTS.md)."
          fi

          if [ "$CRITICAL_FAILED" -gt 0 ]; then
            echo "Quality gate FAILED: one or more @critical scenarios failed."
            exit 1
          fi
          if [ "$PASS_RATE" -lt "$MIN_PASS_RATE" ]; then
            echo "Quality gate FAILED: pass rate ${PASS_RATE}% is below threshold ${MIN_PASS_RATE}%."
            exit 1
          fi
          echo "Quality gate PASSED."

      - name: Send email notification
        # Disabled for now — flip to `if: always()` once SMTP secrets
        # (SMTP_SERVER, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD,
        # NOTIFY_EMAIL_TO) are provisioned.
        if: false
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CI ${{ job.status }}: ${{ github.repository }} (${{ github.event_name }})"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: Automation Framework CI
          body: |
            ${{ steps.quality_gate.outputs.summary }}

            Branch/ref: ${{ github.ref }}
            Triggered by: ${{ github.event_name }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Allure report (GitHub Pages): https://bbyteknight.github.io/automation_framework/

  desktop:
    name: Desktop (Windows / NovaWindows)
    # Manual-only, same precedent as android/ios: @desktop scenarios drive real Windows UI
    # Automation, which needs an actual interactive, unlocked desktop session — GitHub-hosted
    # windows-latest runners execute as a non-interactive service account and can't do this, so
    # this job targets a self-hosted runner instead. See DESKTOP_AUTOMATION_SETUP.md
    # ("CI: self-hosted Windows runner") for how that runner is provisioned (auto-logon
    # interactive session, Appium 3 + NovaWindows driver preinstalled, sample app pre-staged at
    # DESKTOP_APP_PATH below) and labeled self-hosted/windows/desktop.
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'desktop' || inputs.platform == 'all')
    runs-on: [self-hosted, windows, desktop]
    # Best-effort until a runner carrying these labels is actually registered — this definition
    # documents the intended pipeline shape (see the DoD in DESKTOP_AUTOMATION_SETUP.md) without
    # blocking the rest of the workflow while that runner is provisioned.
    continue-on-error: true
    env:
      ENV: ${{ inputs.env || 'dev' }}
      # Pre-staged on the runner during provisioning (same precedent as the mobile emulator's
      # Sauce Labs demo app, installed manually rather than built by the pipeline) — not part of
      # this repo. See DESKTOP_AUTOMATION_SETUP.md.
      DESKTOP_APP_PATH: 'C:\apps\TestLoginApp\TestLoginApp.exe'
      APPIUM_SERVER_URL: 'http://127.0.0.1:4723'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B -ntp clean compile test-compile

      - name: Verify Appium + NovaWindows driver are installed
        shell: pwsh
        # Provisioning installs these once (see DESKTOP_AUTOMATION_SETUP.md); this just confirms
        # the runner's image hasn't drifted, it doesn't (re)install on every run.
        run: |
          appium -v
          appium driver list --installed

      - name: Start Appium server (background) and wait for readiness
        id: start_appium
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "cmd.exe" `
            -ArgumentList "/c appium server -p 4723 > appium-server.log 2>&1" `
            -PassThru -WindowStyle Hidden
          "APPIUM_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $resp = Invoke-RestMethod -Uri "$env:APPIUM_SERVER_URL/status" -TimeoutSec 2
              if ($resp.value.ready) { $ready = $true; break }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            Write-Error "Appium server did not become ready within 60s"
            Get-Content appium-server.log -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Appium server ready at $env:APPIUM_SERVER_URL"

      - name: Test desktop scenarios
        shell: pwsh
        run: >
          mvn -B -ntp test -Pdesktop "-Dplatform=windows"
          "-DdesktopAppPath=$env:DESKTOP_APP_PATH"
          "-DappiumServerUrl=$env:APPIUM_SERVER_URL"

      - name: Generate Allure report
        if: always()
        shell: pwsh
        run: mvn -B -ntp exec:exec@allure-report

      - name: Upload Allure report (desktop)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-desktop
          path: target/allure-report
          retention-days: 30

      - name: Upload Cucumber HTML report (desktop)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-desktop
          path: target/cucumber-reports
          retention-days: 30

      - name: Upload failure screenshots (desktop)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-desktop
          path: test-output/screenshots
          retention-days: 30
          if-no-files-found: ignore

      - name: Stop Appium server
        if: always()
        shell: pwsh
        run: |
          if ($env:APPIUM_PID) {
            Stop-Process -Id $env:APPIUM_PID -Force -ErrorAction SilentlyContinue
          }

  publish-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sonar:
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar wants full git history for blame/new-code analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: SonarCloud analysis
        # continue-on-error until SONAR_TOKEN (sonarcloud.io) is provisioned —
        # see README.md "Code quality". Compiles (not a full test run, to
        # avoid re-running the suite a second time) then analyzes.
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B -ntp compile sonar:sonar
