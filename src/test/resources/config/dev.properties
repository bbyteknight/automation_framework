env=dev
platform=web
baseUrl=https://the-internet.herokuapp.com/login
loginUsername=tomsmith
loginPassword=SuperSecretPassword!
apiBaseUrl=https://jsonplaceholder.typicode.com
# Public sandbox API, same across all environments (not env-specific like apiBaseUrl above)
restfulApiBaseUrl=https://api.restful-api.dev
browser=chrome
browsers=chrome,firefox,edge
executionMode=local
timeout=6
implicitTimeout=6
explicitTimeout=20
pageLoadTimeout=30
headless=false

# Mobile (Appium) — all optional, read by drivers.MobileDriverFactory. Only
# non-blank values are passed as capabilities, so uncomment/override just the
# ones your run needs (e.g. via -DdeviceName=... or an env var) rather than
# filling in every key.
appiumServerUrl=http://127.0.0.1:4723
# deviceName=Pixel_7_API_34
# platformVersion=14
# udid=                     # real device serial, or an already-running emulator/simulator's UDID
# avd=Pixel_7_API_34        # Android only — boots this named emulator if not already running
# appPath=                  # path/URL to a .apk/.ipa/.app to install, instead of appPackage/bundleId below
# Sauce Labs "My Demo App" (https://github.com/saucelabs/my-demo-app-android) — installed
# manually via `adb install` on the already-running Pixel_7_API_34 emulator for the sample
# @android mobile_shopping.feature, so appPath isn't needed to launch it.
appPackage=com.saucelabs.mydemoapp.android
appActivity=.view.activities.SplashActivity
# bundleId=com.example.app

# Cloud device farm (BrowserStack App Automate) — set executionMode=cloud to run mobile
# scenarios on a real BrowserStack device instead of the local emulator/Appium server.
# Credentials are NEVER put in this file: set them as real environment variables
# (BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY), e.g. in CI secrets or a local,
# gitignored .env file — see ConfigReader's env-var resolution order and SECRETS.md.
# executionMode=cloud
# appUrl=                        # a "bs://..." app already uploaded to BrowserStack — if set,
#                                 # takes priority and skips auto-upload entirely
# appPath=                       # when executionMode=cloud and appUrl is blank, this local
#                                 # .apk/.ipa is uploaded automatically via CloudAppUploader
# cloudProjectName=AutomationFramework
# cloudBuildName=local-build
# cloudSessionName=Mobile session

# Desktop (Windows, Appium NovaWindows driver) — all optional, read by
# utils.DriverFactory.initDesktopDriver(). Reuses appiumServerUrl above (same
# local Appium server as mobile). platform defaults to "web" above, so
# @desktop runs need an explicit -Dplatform=windows override (only "windows"
# is supported today — see DESKTOP_AUTOMATION_SETUP.md).
# desktopAppPath=C:\\apps\\TestLoginApp\\TestLoginApp.exe   # .exe path, or a UWP AUMID
# desktopAppArguments=
# desktopAppWorkingDir=
# desktopDelayBeforeClick=150   # ms; NovaWindows capability, default 150 if unset
# desktopDelayAfterClick=150    # ms; NovaWindows capability, default 150 if unset

# Database (db.DbClient, HikariCP-pooled). dbUrl is a standard JDBC URL — its scheme picks
# the driver (postgresql/mysql/sqlserver/oracle:thin, see pom.xml for the drivers on the
# classpath). dbUsername/dbPassword are NEVER set here: they're secrets, so they must come
# from a real environment variable or a local .env file (DB_USERNAME / DB_PASSWORD) — see
# SECRETS.md. Pool sizing is optional; defaults shown are DbClient's built-in fallbacks.
#
# dbUrl defaults to an in-memory H2 database (test-scoped dependency, see pom.xml) so @database
# scenarios run with zero setup on dev. Point it at a real Postgres/MySQL/SQL Server/Oracle
# instance here (or override via -DdbUrl=... / DB_URL env var) once dev has one; qa/staging
# intentionally have no dbUrl of their own yet, so @database scenarios there must be given one
# explicitly until each environment's real database is provisioned.
# dbUsername/dbPassword are left unset here deliberately — H2 accepts an anonymous connection,
# and DbClient skips setUsername/setPassword entirely when they're blank.
dbUrl=jdbc:h2:mem:automation_dev;DB_CLOSE_DELAY=-1
# dbMaxPoolSize=10
# dbMinIdle=2
# dbConnectionTimeoutMs=30000
# dbIdleTimeoutMs=600000
# dbMaxLifetimeMs=1800000

# NoSQL (db.MongoClientWrapper / db.RedisClient). Left blank here deliberately: when mongoUri/
# redisHost are blank, hooks.NoSqlTestInfraHooks auto-starts an in-process, pure-Java fake
# MongoDB/Redis for @nosql scenarios — zero setup on dev, see CONTRIBUTING.md "Validating NoSQL
# stores". Uncomment and point these at a real instance (or override via -DmongoUri=... /
# MONGO_URI env var) to validate against it instead.
# mongoUri=mongodb://localhost:27017
# mongoDatabase=app
# redisHost=localhost
# redisPort=6379
# redisMaxPoolSize=10
# redisPassword is a secret — never set here; comes from REDIS_PASSWORD env var / .env, see SECRETS.md
